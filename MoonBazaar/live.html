    <script>
        function escapeHTML(str) {
            const p = document.createElement('p');
            p.appendChild(document.createTextNode(str));
            return p.innerHTML;
        }

        function createFeedElement(tx) {
            const item = document.createElement('div');
            item.style.border = '1px solid #ccc';
            item.style.borderRadius = '8px';
            item.style.padding = '8px 10px';
            item.style.margin = '6px 0';
            item.style.fontSize = '0.9em';
            const robuxValue = parseFloat(tx.robux_val);
            const formattedRobux = parseFloat(robuxValue.toFixed(4));
            let description = '';
            if (robuxValue > 0) {
                item.style.borderColor = '#28a745';
                description = `<b>${escapeHTML(tx.username)}</b> 在 ${escapeHTML(tx.source)} 获得了 <b style="color:#155724;">${formattedRobux} Gascoin</b>`;
            } else {
                item.style.borderColor = '#d9534f';
                const absRobux = Math.abs(formattedRobux);
                description = `<b>${escapeHTML(tx.username)}</b> 在 ${escapeHTML(tx.source)} 被扣除 <b style="color:#721c24;">${absRobux} Gascoin</b>`;
            }
            const time = document.createElement('span');
            time.style.float = 'right';
            time.style.color = '#777';
            time.style.fontSize = '0.85em';
            time.textContent = tx.time_ago;
            const p = document.createElement('p');
            p.style.margin = '0';
            p.innerHTML = description;
            item.appendChild(p);
            item.appendChild(time);
            return item;
        }

        async function loadLiveFeed() {
            const container = document.getElementById('live-feed-container');
            try {
                // 获取最新 20 条，不再带有 token
                const direct = 'https://moonbazaar.xyz/home/get_live_feed.php?limit=20&offset=0';
                // moonbazaar 未开放 CORS，走代理转发（按顺序回退）
                const proxies = [
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent(direct),
                    'https://corsproxy.io/?url=' + encodeURIComponent(direct),
                    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(direct)
                ];
                let response = null;
                for (const url of proxies) {
                    try {
                        response = await fetch(url);
                        if (response.ok) break;
                    } catch (e) { /* try next proxy */ }
                }
                if (response && response.ok) {
                    const data = await response.json();
                    // 清空并加载最新的20条，避免和推流出现重复元素显示
                    container.innerHTML = '';
                    data.forEach(item => {
                        container.appendChild(createFeedElement(item));
                    });
                } else {
                    container.innerHTML = '<p style="color:#777;">无法加载动态信息</p>';
                    console.error('Failed to load initial live feed data');
                }
            } catch (err) {
                container.innerHTML = '<p style="color:#777;">无法加载动态信息</p>';
                console.error('Failed to fetch live feed:', err);
            }
        }

        loadLiveFeed();
    </script>
