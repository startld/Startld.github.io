    <script>
var initWinOdds = 0.49;
var initGasCoin = 761.174;
/**
 * 命运转盘 (单人)
 * 当前赢率: 49%
 * 当前输率: 51%
 * ?
 * 挑战命运 (10 GC)
 * 赢: 12~180 GC, 但下次难度增加! (winOdds-=0.01)
 * 输: 扣除 10~240 GC, 几率重置 (winOdds+=0.01)
 */
function challengeFate(winOdds, gascoin) {
    var random = Math.random();
    if (random >= winOdds) {
        var reduced = Math.min(Math.random() * 230 + 10, gascoin);
        return [gascoin - reduced, winOdds + 0.01, -reduced];
    }
    else {
        var increased = Math.random() * (180 - 12) + 12;
        return [gascoin + increased, winOdds - 0.01, increased];
    }
}

<script>
    let winOdds = 0.50;
    let gascoin = 100;
    let gascoinElement = document.getElementById("gascoinele")
    let winOddsElement = document.getElementById("winoddsele")
    function updateUI() {
        gascoinElement.innerText = gascoin.toFixed(3);
        winOddsElement.innerText = (winOdds*100)+"%";
    }
    function setGC() {
        gascoin = +(document.getElementById("gascoininput").value)
        if (!isFinite(gascoin)) {
            gascoin = 100;
        }
        updateUI();
    }
    function setWinOdds() {
        winOdds = +(document.getElementById("winoddsinput").value)
        if (!isFinite(winOdds)) {
            winOdds = 0.5;
        }
        updateUI();
    }
    function challengeFateUI() {
        if (gascoin < 10) return;
        const rollElement = document.getElementById("roll-data")
        rollElement.className = "rolling";
        let rollInterval = setInterval(()=>{
            rollElement.innerText = Math.floor(Math.random()*100)
        }, 50);
        setTimeout(function() {
            clearInterval(rollInterval)
            let chal = challengeFate(winOdds,gascoin);
            if (chal[2] > 0){
                rollElement.innerText = "+"+chal[2].toFixed(3);
                rollElement.className = "win";
            } else {
                rollElement.innerText = chal[2].toFixed(3);
                rollElement.className = "failed";
            }
            [gascoin,winOdds] = [chal[0], chal[1]]
            updateUI();
        }, 750)

    }
    updateUI();
</script>
<style>
    .win {
        color: green;
    }
    .failed {
        color: red;
    }
</style>
